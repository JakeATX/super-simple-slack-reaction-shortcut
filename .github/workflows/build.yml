name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check installer syntax
        run: bash -n install-macos.sh uninstall-macos.sh scripts/build-macos.sh
      - name: Build universal Mac app and run self-tests
        run: ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/*
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          foreach ($path in @('install-windows.ps1', 'uninstall-windows.ps1', 'scripts/build-windows.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$path : $errors" }
          }
      - name: Build Windows x64 and ARM64 helpers and run self-tests
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish checked release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum super-simple-slack-reaction-shortcut-* > SHA256SUMS
          gh release create "$TAG" --title "Super Simple Slack Reaction Shortcut $TAG" --generate-notes --verify-tag ./*
